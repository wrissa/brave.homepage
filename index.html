<!doctype html>
<html lang="fi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

/* Teemamuuttujat */
:root {
  --bg: #f5f5f5;
  --shadow: rgb(0, 11, 36);
  --btn-bg: #000000;
  --btn-color: #fff;
}

body.tumma {
  --bg: #131313;
  --shadow: rgba(0, 23, 44, 0.6);
  --btn-bg: #fdfdfd;
  --btn-color: #111111;
}

body {
  margin: 0;
  background: var(--bg);
  transition: background 0.3s;
}

/* Teemanappi */
#teema-nappi {
  position: fixed;
  top: 1rem;
  right: 1rem;
  background: var(--btn-bg);
  color: var(--btn-color);
  border: none;
  border-radius: 2rem;
  padding: 0.5rem 1.1rem;
  font-size: 1.2rem;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  transition: background 0.3s, color 0.3s;
  z-index: 100;
}

#teema-nappi:hover {
  opacity: 0.85;
}

/* GRID: 7 x 4 */
.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1.2rem;
  padding: 1rem;

  max-width: 1700px;
  margin: 0 auto;

  height: 25vh;
  box-sizing: border-box;
}

/* jokainen solu */
.grid > div {
  aspect-ratio: 1 / 1;
  width: 100%;
  height: 100%;
}

/* ikonilaatikko */
.zoom {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 20%;
  box-shadow: 5px 5px 10px var(--shadow);
  transition: transform .2s, box-shadow 0.3s;
  display: flex;
}

/* hover */
.zoom:hover {
  transform: scale(1.08);
  z-index: 2;
}

/* kuva oikein */
.zoom img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* mobiili */
@media (max-width: 768px) {
  .grid { 
    grid-template-columns: repeat(4, 1fr);
  }
}

</style>
</head>

<body>

<button id="teema-nappi">🌙</button>

<main class="grid">

<div class="zoom"><a href="https://www.netflix.com/browse"><img src="netflix3.png"></a></div>
<div class="zoom"><a href="https://www.max.com/fi/fi"><img src="hbo.png"></a></div>
<div class="zoom"><a href="https://www.disneyplus.com/fi-fi"><img src="disney.png"></a></div>
<div class="zoom"><a href="https://www.primevideo.com/"><img src="prime.png"></a></div>
<div class="zoom"><a href="https://areena.yle.fi/tv"><img src="areena1.png"></a></div>

</main>

<script>

const nappi = document.getElementById('teema-nappi');
const body = document.body;

// Tarkista onko tumma teema tallennettu
if (localStorage.getItem('teema') === 'tumma') {
  body.classList.add('tumma');
  nappi.textContent = '☀️';
}

// Nappia klikatessa vaihda teema
nappi.addEventListener('click', function() {
  body.classList.toggle('tumma');

  if (body.classList.contains('tumma')) {
    nappi.textContent = '☀️';
    localStorage.setItem('teema', 'tumma');
  } else {
    nappi.textContent = '🌙';
    localStorage.setItem('teema', 'vaalea');
  }
});

</script>

</body>
</html>
