<!doctype html>
<html lang="fi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
  margin: 0;
  background: #f5f5f5;

}

/* GRID: 7 x 4 */
.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1.2rem;
  padding: 1rem;

  max-width: 1700px;
  margin: 0 auto;

  height: 40vh;
  box-sizing: border-box;
}

/* jokainen solu */
.grid > div {
  aspect-ratio: 1 / 1;
  width: 100%;
  height: 100%;
}

/* ikonilaatikko */
.zoom {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 20%;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
  transition: transform .2s;
  display: flex;
}

/* hover */
.zoom:hover {
  transform: scale(1.08);
  z-index: 2;
}

/* kuva oikein */
.zoom img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* mobiili */
@media (max-width: 768px) {
  .grid { 
    grid-template-columns: repeat(4, 1fr);
  }
}

</style>
</head>

<body>

<main class="grid">

<div class="zoom"><a href="https://nordnet.fi"><img src="Kuvat/nordnet.png"></a></div>
<div class="zoom"><a href="https://www.netflix.com/browse"><img src="Kuvat/netflix3.png"></a></div>
<div class="zoom"><a href="https://www.max.com/fi/fi"><img src="Kuvat/hbo.png"></a></div>

<div class="zoom"><a href="https://www.disneyplus.com/fi-fi"><img src="Kuvat/disney.png"></a></div>
<div class="zoom"><a href="https://www.primevideo.com/"><img src="Kuvat/prime.png"></a></div>
<div class="zoom"><a href="https://areena.yle.fi/tv"><img src="Kuvat/areena1.png"></a></div>
<div class="zoom"><a href="https://youtube.com/"><img src="Kuvat/youtube1.png"></a></div>
<div class="zoom"><a href="https://facebook.com/"><img src="Kuvat/facebook.png"></a></div>
<div class="zoom"><a href="https://web.whatsapp.com/"><img src="Kuvat/whatsapp.png"></a></div>
<div class="zoom"><a href="https://chatgpt.com/"><img src="Kuvat/gpt.png"></a></div>
<div class="zoom"><a href="https://claude.ai/"><img src="Kuvat/claude.png"></a></div>



</main>

</body>
</html>
